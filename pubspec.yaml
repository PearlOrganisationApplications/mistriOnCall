environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_screenutil: 5.9.3
  font_awesome_flutter: ^10.7.0
  flutter_svg: 2.0.10+1
  curved_navigation_bar: 1.0.6
  flutter_side_menu: ^0.5.3
  change_app_package_name: 1.3.0
  image_picker: 1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  razorpay_flutter: ^1.3.7
  intl: ^0.19.0
  modal_bottom_sheet: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.3.1
  intl_phone_field: ^3.2.0
  awesome_snackbar_content: ^0.1.4
  firebase_auth: ^5.4.2
  google_sign_in: ^6.2.2
  firebase_core: ^3.11.0
  flutter_facebook_auth: ^7.1.1
  flutter_web_auth: ^0.6.0
  firebase_app_check: ^0.3.2+5
  emailjs: ^4.0.0


dependency_overrides:
  carousel_slider: null

dev_dependencies:
  flutter_test:
    sdk: flutter


##CMD : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_background.png"
  min_sdk_android: 21
  background_color: "#FFFFFF"


  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
